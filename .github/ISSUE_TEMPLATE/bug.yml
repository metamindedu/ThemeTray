name: 버그 제보
description: ThemeTray의 문제를 알려 주세요. 민감한 정보는 제외해 주세요.
title: '[버그] '
body:
  - type: markdown
    attributes:
      value: '좌표·계정명·개인 경로·전체 설정·민감한 로그를 올리지 마세요. 스크린샷도 해당 부분을 가려 주세요.'
  - type: input
    id: version
    attributes:
      label: ThemeTray 버전
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 버전·화면 배율
      placeholder: Windows 11 24H2, 150%
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 사용 방식
      options: [설치형, 포터블 ZIP]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 어떤 조작 후 문제가 생겼나요?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작과 실제 동작
    validations:
      required: true
